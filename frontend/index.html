<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand-fallback.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoNavi</title>
    <style>
      html, body { height: 100%; margin: 0; }
      html[data-gonavi-windows="true"],
      html[data-gonavi-windows="true"] body {
        background: #f4f6f8;
      }
      html[data-gonavi-windows="true"][data-theme="dark"],
      html[data-gonavi-windows="true"][data-theme="dark"] body {
        background: #14161a;
      }
      #gonavi-boot-splash {
        align-items: center;
        background: #f4f6f8;
        box-sizing: border-box;
        color: #4b5563;
        display: flex;
        flex-direction: column;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        gap: 12px;
        inset: 0;
        justify-content: center;
        letter-spacing: 0.02em;
        position: fixed;
        z-index: 2147483646;
      }
      html[data-theme="dark"] #gonavi-boot-splash {
        background: #14161a;
        color: #d1d5db;
      }
      #gonavi-boot-splash[hidden] { display: none !important; }
      #gonavi-boot-splash[data-state="error"] [data-boot-message] {
        max-width: 36em;
        text-align: center;
        white-space: pre-wrap;
      }
    </style>
    <script>
      (function () {
        try {
          if (/Win/i.test(String(navigator.userAgent || ''))) {
            document.documentElement.setAttribute('data-gonavi-windows', 'true');
          }
          var dark = false;
          var raw = window.localStorage ? localStorage.getItem('lite-db-storage') : '';
          if (raw) {
            var parsed = JSON.parse(raw);
            var state = parsed && (parsed.state || parsed);
            var pref = String((state && (state.themePreference || state.theme)) || '');
            if (pref === 'dark') dark = true;
            else if (pref === 'system' && window.matchMedia) {
              dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          }
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
        if (typeof window !== 'undefined' && !window.go) {
          window.go = {
            app: {
              App: new Proxy({}, { get: () => async () => ({ success: false }) })
            }
          };
        }
        if (typeof window !== 'undefined' && !window.runtime) {
          window.runtime = new Proxy({}, {
              get: (target, prop) => {
                  if (prop === 'Environment') return async () => ({ platform: 'darwin' });
                  return typeof prop === 'string' && prop.startsWith('WindowIs') ? () => false : () => {};
              }
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="gonavi-boot-splash" data-state="loading" role="status">
      <strong>GoNavi</strong>
      <span data-boot-message>Starting…</span>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var message = document.querySelector('[data-boot-message]');
        if (!message) return;
        var lang = String((navigator.language || '')).toLowerCase();
        message.textContent = lang.indexOf('zh') === 0 ? '正在启动…' : 'Starting…';
      })();
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
